name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    #
    # Manual dispatch can run from any branch; only deploy from master or main.
    #
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    uses: dwayne/nix-elm-parcel/.github/workflows/reusable-deploy.yml@198fbd02d6f20ec6efedb41a8c9754fc1e7a9691
    permissions:
      contents: write
